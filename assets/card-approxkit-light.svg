<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-labelledby="t d">
<title id="t">ApproxKit</title>
<desc id="d">ApproxKit: bit-accurate Python models, error metrics, a Pareto design-space explorer and Verilog implementations of approximate adders and multipliers. 173 of 173 RTL configurations match the Python models exhaustively over every operand pair in Icarus Verilog. Area figures are synthesis estimates, not silicon.</desc>
