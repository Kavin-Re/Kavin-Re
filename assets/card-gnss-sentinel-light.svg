<text x="24" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1b2430">GNSS-Sentinel</text>
<text x="24" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#57626f"><tspan x="24" dy="0">Flags GNSS jamming and spoofing</tspan><tspan x="24" dy="18">indicators in receiver logs with six</tspan><tspan x="24" dy="18">fused detectors. Never transmits.</tspan></text>
