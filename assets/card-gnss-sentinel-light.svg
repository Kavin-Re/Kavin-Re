<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-labelledby="t d">
<title id="t">GNSS-Sentinel</title>
<desc id="d">GNSS-Sentinel: a passive toolkit that flags GNSS interference and spoofing indicators from receiver-level logs using six fused detectors. On the repository's own synthetic data, fused detection probability is 1.00 for four attack scenarios and 0.74 for slow position drag. Not validated on a real receiver.</desc>
