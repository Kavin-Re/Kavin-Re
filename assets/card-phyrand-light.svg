<title id="t">PhyRand</title>
<desc id="d">PhyRand: Zener-diode noise true random number generator on STM32F401RE with a FastAPI key authority and Fernet file vault. Measured entropy 7.9997 bits per byte with the ent suite; NIST SP 800-22 testing is pending.</desc>
