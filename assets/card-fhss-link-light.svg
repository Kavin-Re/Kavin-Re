<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-labelledby="t d">
<title id="t">FHSS-Link</title>
<desc id="d">FHSS-Link: simulation study of a frequency-hopping link under interference. An attacker model recovers a 16-bit LFSR hop schedule after 8 or 9 observed hops, exhaustively over all 65,535 seeds; a keyed SipHash-2-4 hop engine in Verilog replaces it. Simulation, RTL and host-tested C only; nothing has run on a radio.</desc>
