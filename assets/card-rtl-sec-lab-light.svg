<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-labelledby="t d">
<title id="t">RTL-Sec-Lab</title>
<desc id="d">RTL-Sec-Lab: a self-contained three-hour hardware-security workshop kit with six labs on a small keyed hop engine: LFSR state recovery, correlation power analysis, masking, fault injection and TMR, trojan detection and a PUF key source. All 39 reference-solution tasks pass the graders. Simulation only, with assumed leakage and fault models.</desc>
