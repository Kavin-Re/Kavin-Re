<title id="t">Approximate SAD</title>
<desc id="d">Approximate SAD: research internship work on approximate compressor cells in a shared 8x8 sum-of-absolute-differences datapath for video motion estimation, synthesised and run inside the x264 and x265 encoders. Co-authored manuscript, not yet published; the repository is private.</desc>
