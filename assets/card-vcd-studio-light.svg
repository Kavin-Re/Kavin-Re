<title id="t">VCD-Studio</title>
<desc id="d">VCD-Studio: a waveform viewer for Verilog VCD dumps that is one offline HTML file, with a signal tree, cursors, search, clock measurements and a short-pulse finder, plus a standard-library Python script for toggle counts.</desc>
