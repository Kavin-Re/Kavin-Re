<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-labelledby="t d">
<title id="t">GlitchSAT</title>
<desc id="d">GlitchSAT: an open-source fault-analysis tool for gate-level netlists that searches for the smallest number of modelled bit flips that defeat a protection. Under its single-bit model M0, the three reference designs need 1, 1 and 3 modelled bit flips. These are model results, not physical glitches; version 2.0 asks whether adding timing changes the verdict on one real protected block.</desc>
